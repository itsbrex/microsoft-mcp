[project]
name = "microsoft-mcp"
version = "0.2.0"
description = "Microsoft Graph MCP server for Outlook, Calendar, and OneDrive with multi-account support"
readme = "README.md"
authors = [
    { name = "elyx", email = "elio@pascarelli.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3,<4",
    "httpx>=0.28.1",
    "msal>=1.32.3",
    "python-dotenv>=1.1.0",
    "azure-identity>=1.17,<2",
    "msgraph-sdk>=1.0,<2",
    "markitdown>=0.1.3,<1",
    "RestrictedPython>=8.1,<9",
    "pyyaml>=6.0,<7",
]

[project.scripts]
microsoft-mcp = "microsoft_mcp.server:main"
microsoft-mcp-utcp-config = "microsoft_mcp.utcp_bridge_config:main"
microsoft-mcp-signatures = "microsoft_mcp.signatures_cli:cli_main"
microsoft-mcp-auth = "microsoft_mcp.auth_cli:cli_main"
microsoft-mcp-rules = "microsoft_mcp.rules_cli:cli_main"
microsoft-mcp-intel = "microsoft_mcp.intel_cli:cli_main"
microsoft-mcp-bounces = "microsoft_mcp.bounces_cli:cli_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "black>=23.3.0",
    "mcp>=1.9.3",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/microsoft_mcp"]
include = [
    "/src/microsoft_mcp/templates_data/**/*.yaml",
]
