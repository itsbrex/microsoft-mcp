# Calendar Event Template Schema
# Version 1.0
#
# This file documents the schema for calendar event templates used by the templates engine.
# Files prefixed with `_` are skipped by the engine at load time and are not
# returned by list_templates — this file is documentation only.
#
# YAML Template Structure:
# ------------------------
# name: Template identifier (required)
# description: Human-readable description (required)
# version: Template version (required)
# category: Template category for organization (optional)
#
# design:
#   header:
#     background_color: Hex color for header background
#     text_color: Hex color for header text
#     badge:
#       text: Badge text (optional)
#       background_color: Badge background color
#       text_color: Badge text color
#
#   meta_bar:
#     enabled: true/false
#     background_color: Hex color
#     fields: List of fields to show (duration, dial_in, location, custom)
#
#   sections:
#     - type: agenda|notes|pre_read|action_items|custom
#       title: Section title
#       style: default|warning|success|info
#       content_type: list|text|html
#
#   footer:
#     enabled: true/false
#     text: Footer text (supports {placeholders})
#
# placeholders:
#   List of supported placeholders with descriptions
#   - name: placeholder_name
#     description: What this placeholder represents
#     required: true/false
#     default: Default value if not provided

schema_version: "1.0"

# Color palette reference (email-safe colors)
colors:
  # Headers
  navy: "#1e3a5f"
  dark_red: "#7f1d1d"
  teal: "#0f766e"
  purple: "#5b21b6"
  green: "#15803d"
  slate: "#1e293b"

  # Backgrounds
  light_gray: "#f8fafc"
  light_slate: "#f1f5f9"
  amber_light: "#fffbeb"
  green_light: "#f0fdf4"
  red_light: "#fef2f2"
  blue_light: "#eff6ff"

  # Borders
  gray_border: "#e2e8f0"
  amber_border: "#fcd34d"
  green_border: "#22c55e"
  red_border: "#ef4444"
  blue_border: "#3b82f6"

  # Text
  text_primary: "#1e293b"
  text_secondary: "#64748b"
  text_muted: "#94a3b8"
  white: "#ffffff"

# Section type definitions
section_types:
  agenda:
    title: "AGENDA"
    style: default
    content_type: list
    numbering: true

  notes:
    title: "NOTES"
    style: default
    content_type: text

  pre_read:
    title: "PRE-READ REQUIRED"
    style: warning
    content_type: text
    background_color: "#fffbeb"
    border_color: "#fcd34d"

  action_items:
    title: "ACTION ITEMS"
    style: warning
    content_type: list
    numbering: false
    bullet: "•"

  blockers:
    title: "BLOCKERS"
    style: danger
    content_type: list
    border_left_color: "#ef4444"

  next_steps:
    title: "NEXT STEPS"
    style: info
    content_type: list
    background_color: "#f1f5f9"

  custom:
    title: null  # User-defined
    style: default
    content_type: text
